# Publishes an xcod release: on a v* tag (e.g. git tag v1.2.0 && git push origin v1.2.0) it tests,
# builds for Linux (amd64 and arm64) and creates the Release with the binaries, the installer and
# SHA256SUMS. Installed servers show the new version in the panel (Server > Updates).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/xcod-linux-$arch ./cmd/xcod
          done
          cp deploy/install.sh dist/
          cd dist && sha256sum xcod-linux-* install.sh > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
